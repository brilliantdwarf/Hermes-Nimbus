name: hermes-nimbus
version: "0.2.0"
description: "Send privacy-safe Hermes lifecycle events to a local Hermes Nimbus dashboard. Configure with HERMES_NIMBUS_EVENT_URL and optional HERMES_NIMBUS_EVENT_TOKEN."
author: "Hermes Nimbus"
provides_hooks:
  - on_session_start
  - on_session_end
  - on_session_finalize
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
  - pre_approval_request
  - post_approval_response
