<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Halo - 状态详情</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0d0d0d;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #ccc;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* 顶部导航 */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }
        
        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #ccc;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        
        .fullscreen-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            flex-shrink: 0;
            white-space: nowrap;
        }
        
        .fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        
        .nav-title {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }
        
        .nav-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            flex-shrink: 0;
        }
        
        /* ═══════════ 全屏模式样式 ═══════════ */
        body.is-fullscreen,
        html:has(body.is-fullscreen) {
            overflow: hidden;
        }
        
        body.is-fullscreen .nav { display: none; }
        body.is-fullscreen .instance-header { display: none; }
        body.is-fullscreen .history-toggle { display: none; }
        body.is-fullscreen .history-panel { display: none; }
        
        body.is-fullscreen .main {
            padding: 0;
            margin: 0;
            min-height: 100vh;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            overflow: hidden;
        }
        
        body.is-fullscreen .canvas-wrap {
            margin: 0;
            padding: 0;
            width: 80vmin;
            height: 80vmin;
            max-width: 700px;
            max-height: 700px;
        }
        
        body.is-fullscreen .state-label {
            font-size: 48px;
            margin: 0;
            padding: 0;
            text-shadow: 0 0 60px currentColor;
        }
        
        body.is-fullscreen .state-description {
            font-size: 20px;
            margin: 0;
            padding: 0;
            color: rgba(255,255,255,0.5);
        }
        
        /* 全屏模式退出按钮 - 鼠标移动时显示 */
        .fs-exit-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        body.is-fullscreen .fs-exit-bar {
            pointer-events: auto;
        }
        
        body.is-fullscreen.show-ui .fs-exit-bar {
            opacity: 1;
        }
        
        .fs-exit-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.6);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .fs-exit-btn:hover {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }
        
        .fs-time {
            font-size: 14px;
            color: rgba(255,255,255,0.4);
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
        }
        
        .status-dot.connected { background: #33cc55; box-shadow: 0 0 10px rgba(51, 204, 85, 0.5); }
        .status-dot.disconnected { background: #ff4444; box-shadow: 0 0 10px rgba(255, 68, 68, 0.5); }
        
        /* 主内容 */
        .main {
            margin-top: 80px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
        }
        
        /* 节点信息 */
        .instance-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .instance-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        
        .instance-info h1 {
            font-size: 28px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }
        
        .instance-info p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
        }
        
        /* 光环容器 */
        .canvas-wrap {
            position: relative;
            width: 360px;
            height: 360px;
            margin-bottom: 30px;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        /* 初始加载状态：隐藏光环直到收到真实数据 */
        .canvas-wrap.loading canvas {
            opacity: 0;
        }
        .canvas-wrap canvas {
            transition: opacity 0.4s ease;
        }
        .state-label, .state-description {
            transition: color 0.3s ease;
        }
        
        /* 状态标签 */
        .state-label {
            text-align: center;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
            transition: color 0.3s;
        }
        
        .state-description {
            text-align: center;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 40px;
        }
        
        /* 历史面板 */
        .history-toggle {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        
        .history-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
        }
        
        .history-toggle .arrow { transition: transform 0.3s; font-size: 10px; }
        .history-toggle.expanded .arrow { transform: rotate(180deg); }
        
        .history-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            margin-top: 12px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
        }
        
        .history-panel.visible {
            max-height: 300px;
            padding: 16px;
        }
        
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 250px;
            overflow-y: auto;
        }
        
        .history-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            font-size: 13px;
        }
        
        .history-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .history-time {
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            margin-left: auto;
        }
    </style>
</head>
<body>
    <!-- 全屏模式浮动栏 -->
    <div class="fs-exit-bar">
        <span class="fs-time" id="fsTime"></span>
        <button class="fs-exit-btn" id="fsExitBtn">✕ 退出全屏</button>
    </div>
    
    <div class="nav">
        <button class="back-btn" onclick="window.location.href='index.html'">← 返回</button>
        <span class="nav-title" id="navTitle">加载中...</span>
        <div class="nav-status">
            <button class="fullscreen-btn" onclick="goFullscreen()" title="全屏显示">⛶ 全屏</button>
            <span class="status-dot disconnected" id="statusDot"></span>
            <span id="statusText">未连接</span>
        </div>
    </div>
    
    <div class="main">
        <div class="instance-header">
            <div class="instance-icon" id="instanceIcon">🤖</div>
            <div class="instance-info">
                <h1 id="instanceName">加载中...</h1>
                <p id="instanceDesc">-</p>
            </div>
        </div>
        
        <div class="canvas-wrap loading" id="canvasWrap">
            <canvas id="halo"></canvas>
        </div>
        
        <div class="state-label" id="stateLabel" style="opacity:0">-</div>
        <div class="state-description" id="stateDescription" style="opacity:0">-</div>
        
        <button class="history-toggle" id="historyToggle" onclick="toggleHistory()">
            <span>状态历史</span>
            <span class="arrow">▼</span>
        </button>
        
        <div class="history-panel" id="historyPanel">
            <div class="history-list" id="historyList">
                <div class="history-item" style="color: rgba(255,255,255,0.3);">等待数据...</div>
            </div>
        </div>
    </div>
    
    <script>
    (function(){
        "use strict";
        
        // 获取节点 ID
        var urlParams = new URLSearchParams(window.location.search);
        var instanceId = urlParams.get('id') || 'default';
        
        // ═══════════════════════════════════════════════════════════════
        // 状态配置 - 与 Claude Halo 完全一致
        // ═══════════════════════════════════════════════════════════════
        
        var CONFIGS = {
            idle:         {color:"#aaaaaa",halo:"#cccccc",period:6.0,dashes:[60,30],               ms:0,  md:0,   amin:0.30,amax:0.42,br:0,  rp:0,   rpperiod:0,   label:"空闲",    desc:"正在等待任务"},
            thinking:     {color:"#ff8830",halo:"#ffdbb8",period:2.4,dashes:[70,35,45,30,25,20],   ms:0.6,md:0.4, amin:0.45,amax:0.90,br:5.2,rp:0,   rpperiod:0,   label:"思考中",  desc:"正在处理请求"},
            streaming:    {color:"#e8b100",halo:"#fff0aa",period:2.0,dashes:[60,25,45,20,35,15],   ms:0.7,md:0.30,amin:0.50,amax:0.85,br:3.5,rp:0,   rpperiod:0,   label:"输出中",  desc:"正在生成回复"},
            executing:    {color:"#3399ff",halo:"#bbddff",period:1.3,dashes:[50,25,20,20,35,25,25,22],ms:1.2,md:0.28,amin:0.60,amax:0.90,br:0,  rp:0,   rpperiod:0,   label:"执行中",  desc:"正在调用工具"},
            input_needed: {color:"#ee3333",halo:"#ffcccc",period:2.8,dashes:[80,50,30,25],          ms:1.8,md:0.5, amin:0.52,amax:0.94,br:2.0,rp:0,   rpperiod:0,   label:"等待输入",desc:"需要用户确认"},
            completed:    {color:"#33cc55",halo:"#bbffcc",period:5.0,dashes:[70,35,45,30,25,20],   ms:0.5,md:0.3, amin:0.38,amax:0.84,br:6.0,rp:0,   rpperiod:0,   label:"已完成",  desc:"任务已完成"},
            error:        {color:"#ff4444",halo:"#ffcccc",period:1.5,dashes:[40,20,30,15],          ms:2.0,md:0.6, amin:0.50,amax:0.95,br:1.5,rp:0,   rpperiod:0,   label:"错误",    desc:"出现错误"},
            compacting:   {color:"#9944ff",halo:"#ddccff",period:2.1,dashes:[35,20,35,20,35,20],   ms:0.4,md:0.25,amin:0.38,amax:0.80,br:4.0,rp:0.12,rpperiod:1.6, label:"压缩中",  desc:"正在整理上下文"}
        };
        
        // ═══════════════════════════════════════════════════════════════
        // Canvas 圆环绘制器 — 与 Claude Halo 完全一致
        // ═══════════════════════════════════════════════════════════════
        
        var haloCanvas = document.getElementById("halo");
        var haloCtx = haloCanvas.getContext("2d");
        var hTime=0, hLastT=null, hRafId=null;
        var hTargetState="idle", hCurrentState="idle", hCurrentCfg=CONFIGS.idle;
        var hMorphFrom=null, hMorphTarget="idle", hMorphStart=0, hMorphActive=false;
        var hLifecycle="loading", hEntryStart=null;
        var hPulseSettleStart=0;
        var H_MORPH_DURATION=420, H_ENTRY_DURATION=550;
        
        function haloResize(){
            var dpr=window.devicePixelRatio||1;
            var w=haloCanvas.clientWidth, h=haloCanvas.clientHeight;
            haloCanvas.width=w*dpr;haloCanvas.height=h*dpr;
            haloCtx.setTransform(dpr,0,0,dpr,0,0);
        }
        haloResize();
        // 自动检测 canvas-wrap 尺寸变化（全屏切换、窗口缩放）
        var _canvasWrap = document.querySelector('.canvas-wrap');
        if (window.ResizeObserver) {
            var ro = new ResizeObserver(function() { haloResize(); });
            ro.observe(_canvasWrap);
        } else {
            window.addEventListener("resize", haloResize);
        }
        
        function _hexRgb(h){var m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);return m?[parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)]:[255,255,255];}
        function _lerp(a,b,t){return a+(b-a)*t}
        function _lerpRgb(a,b,t){return[Math.round(_lerp(a[0],b[0],t)),Math.round(_lerp(a[1],b[1],t)),Math.round(_lerp(a[2],b[2],t))]}
        function _rgba(r,g,b,a){return"rgba("+r+","+g+","+b+","+a+")"}
        function _easeInOut(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
        function _easeOutBack(t){var c1=1.70158;return 1+(c1+1)*Math.pow(t-1,3)+c1*Math.pow(t-1,2)}
        function _easeOut(t){return 1-Math.pow(1-t,3)}
        
        function _morphDashArrays(a,b,t){
            var nA=a.length/2,nB=b.length/2;var nFloat=_lerp(nA,nB,t),nDraw=Math.max(1,Math.ceil(nFloat));
            var result=[];var totalA=a.reduce(function(s,v){return s+v},0),totalB=b.reduce(function(s,v){return s+v},0);
            var totalTarget=_lerp(totalA,totalB,t);
            for(var i=0;i<nDraw;i++){var frac=i/nDraw;var ia=Math.floor(frac*nA)%nA,ib=Math.floor(frac*nB)%nB;
            var dl=_lerp(a[ia*2],b[ib*2],t),gl=_lerp(a[ia*2+1],b[ib*2+1],t);
            var bs=nDraw<=nFloat?1:1-(nDraw-nFloat);bs=Math.max(0.02,bs);result.push(dl*bs,gl*bs);}
            var cur=result.reduce(function(s,v){return s+v},0);
            if(cur>0){var sc=totalTarget/cur;for(var j=0;j<result.length;j++)result[j]*=sc}
            return result;
        }
        
        function _morphConfig(a,b,t){
            return{color:_lerpRgb(_hexRgb(a.color),_hexRgb(b.color),t),halo:_lerpRgb(_hexRgb(a.halo),_hexRgb(b.halo),t),
            period:_lerp(a.period,b.period,t),ms:_lerp(a.ms,b.ms,t),md:_lerp(a.md,b.md,t),
            amin:_lerp(a.amin,b.amin,t),amax:_lerp(a.amax,b.amax,t),
            br:_lerp(a.br,b.br,t),rp:_lerp(a.rp,b.rp,t),rpperiod:_lerp(a.rpperiod,b.rpperiod,t),
            dashes:_morphDashArrays(a.dashes,b.dashes,t)};
        }
        
        // 无 phaseSyncTimeOffset — 使用累积角度平滑过渡
        
        function _drawRing(cx,cy,R,cfg,alphaMul,timeOff){
            if(alphaMul<=0.001)return;
            var t=hTime+(timeOff||0);
            var mainRgb=Array.isArray(cfg.color)?cfg.color:_hexRgb(cfg.color);
            var haloRgb=Array.isArray(cfg.halo)?cfg.halo:_hexRgb(cfg.halo);
            var breathe=0;
            if(cfg.br>0){var ph=(t%cfg.br)/cfg.br;breathe=Math.max(0,Math.sin(ph*Math.PI*2))}
            var alpha=(cfg.br>0?cfg.amin+(cfg.amax-cfg.amin)*breathe:cfg.amax)*alphaMul;
            var offset=((t/cfg.period)*Math.PI*2)%(Math.PI*2);
            var rawSum=cfg.dashes.reduce(function(a,b){return a+b},0);
            var haloLw=Math.max(R*0.28,1.5),haloAngExt=haloLw/R,minGap=haloAngExt*1.20;
            var rawAngles=[];
            for(var i=0;i<cfg.dashes.length;i++){var morph=Math.sin(t*cfg.ms+i*2.1);
            var ang=(cfg.dashes[i]/rawSum)*Math.PI*2;
            if(i%2===0){ang*=1+cfg.md*morph;ang=Math.max(0.02,ang)}else{ang*=1-cfg.md*0.5*morph;ang=Math.max(minGap,ang)}
            rawAngles.push(ang);}
            var dashTotal=0,gapTotal=0;
            for(var j=0;j<rawAngles.length;j++){if(j%2===0)dashTotal+=rawAngles[j];else gapTotal+=rawAngles[j]}
            var dashTarget=Math.PI*2-gapTotal,dashScale=dashTotal>0.001?dashTarget/dashTotal:1;
            var cumul=0;
            for(var k=0;k<rawAngles.length;k++){var ang=k%2===0?rawAngles[k]*dashScale:rawAngles[k];
            var a0=cumul-offset,a1=a0+ang;cumul+=ang;if(k%2===1)continue;
            haloCtx.strokeStyle=_rgba(haloRgb[0],haloRgb[1],haloRgb[2],alpha*0.55);
            haloCtx.lineWidth=haloLw;haloCtx.lineCap="round";haloCtx.beginPath();haloCtx.arc(cx,cy,R,a0,a1,false);haloCtx.stroke();
            var mid=_lerpRgb(haloRgb,mainRgb,0.5);
            haloCtx.strokeStyle=_rgba(mid[0],mid[1],mid[2],alpha*0.85);
            haloCtx.lineWidth=Math.max(R*0.16,1);haloCtx.lineCap="round";haloCtx.beginPath();haloCtx.arc(cx,cy,R,a0,a1,false);haloCtx.stroke();
            haloCtx.strokeStyle=_rgba(mainRgb[0],mainRgb[1],mainRgb[2],alpha);
            haloCtx.lineWidth=Math.max(R*0.10,1);haloCtx.lineCap="round";haloCtx.beginPath();haloCtx.arc(cx,cy,R,a0,a1,false);haloCtx.stroke();}
        }
        
        function _drawGlowBridge(cx,cy,R,a,b,t){
            var ga=Math.sin(t*Math.PI)*0.32;if(ga<0.005)return;
            var midRgb=_lerpRgb(_hexRgb(a.color),_hexRgb(b.color),t);
            haloCtx.strokeStyle=_rgba(midRgb[0],midRgb[1],midRgb[2],ga*0.22);
            haloCtx.lineWidth=Math.max(R*0.50,3.5);haloCtx.lineCap="round";haloCtx.beginPath();haloCtx.arc(cx,cy,R,0,Math.PI*2,false);haloCtx.stroke();
            haloCtx.strokeStyle=_rgba(midRgb[0],midRgb[1],midRgb[2],ga*0.40);
            haloCtx.lineWidth=Math.max(R*0.22,1.8);haloCtx.lineCap="round";haloCtx.beginPath();haloCtx.arc(cx,cy,R,0,Math.PI*2,false);haloCtx.stroke();
        }
        
        function _radiusPulseFactor(cfg,tNow){
            if(!cfg.rp||cfg.rpperiod<=0)return 1;if(hPulseSettleStart<=0)return 1;
            var elapsed=tNow-hPulseSettleStart;if(elapsed<0)return 1;
            var ramp=Math.min(1,Math.max(0,elapsed-0.20)/0.50);
            var erp=cfg.rp*(1-Math.pow(1-ramp,3));if(erp<=0.001)return 1;
            return 1+erp*Math.sin((tNow%cfg.rpperiod)/cfg.rpperiod*Math.PI*2);
        }
        
        function haloFrame(ts){
            hRafId=null;if(!hLastT)hLastT=ts;
            var dt=(ts-hLastT)/1000;if(dt<=0)dt=0.016;else if(dt>0.1)dt=0.1;
            hLastT=ts;hTime+=dt;
            
            // loading 状态：什么都不画，等待首条 WS 数据触发 startRender()
            if(hLifecycle==="loading"){
                hRafId=requestAnimationFrame(haloFrame);return;
            }
            
            var w=haloCanvas.clientWidth,h=haloCanvas.clientHeight;
            var cx=Math.floor(w/2),cy=Math.floor(h/2);
            var baseR=Math.min(w,h)*0.38;
            
            // 入场动画
            var entryScale=1,entryAlpha=1;
            if(hLifecycle==="entering"){if(!hEntryStart)hEntryStart=ts;
            var raw=Math.min((ts-hEntryStart)/H_ENTRY_DURATION,1);
            entryScale=0.2+0.8*_easeOutBack(raw);entryAlpha=_easeOut(raw);
            if(raw>=1)hLifecycle="active";}
            var ringScale=entryScale,ringAlpha=entryAlpha;
            
            // 活跃配置（用于半径脉冲计算）
            var activeCfg=hMorphActive?_morphConfig(hMorphFrom,CONFIGS[hMorphTarget],Math.min((ts-hMorphStart)/H_MORPH_DURATION,1)):hCurrentCfg;
            var rpF=_radiusPulseFactor(activeCfg,hTime);
            var RR=baseR*ringScale*rpF;
            
            haloCtx.clearRect(0,0,w,h);
            
            // 检测状态变化
            if(hLifecycle==="active"&&hTargetState!==hCurrentState&&!hMorphActive){
                hPulseSettleStart=0;
                hMorphFrom=hCurrentCfg;hMorphTarget=hTargetState;hMorphStart=ts;hMorphActive=true;
            }
            
            // 渲染 — 与 Claude Halo / index.html 完全一致
            if(hLifecycle!=="active"){
                _drawRing(cx,cy,RR,hCurrentCfg,ringAlpha,0);
            }else if(hMorphActive){
                var elapsed=ts-hMorphStart,rawM=Math.min(elapsed/H_MORPH_DURATION,1);
                var tE=rawM<0.5?2*rawM*rawM:1-Math.pow(-2*rawM+2,2)/2;
                var interpCfg=_morphConfig(hMorphFrom,CONFIGS[hMorphTarget],tE);
                _drawRing(cx,cy,RR,interpCfg,ringAlpha,0);
                _drawGlowBridge(cx,cy,RR,hMorphFrom,CONFIGS[hMorphTarget],tE);
                if(rawM>=1){hMorphActive=false;hCurrentState=hMorphTarget;hCurrentCfg=CONFIGS[hMorphTarget];hMorphFrom=null;
                if(CONFIGS[hMorphTarget].rp>0)hPulseSettleStart=hTime+0.06;}
            }else{
                _drawRing(cx,cy,RR,hCurrentCfg,ringAlpha,0);
            }
            
            if(hLifecycle!=="closed"){hRafId=requestAnimationFrame(haloFrame)}
        }
        
        // 公共接口
        var renderer = {
            setState: function(state) {
                if(!CONFIGS[state]||hTargetState===state)return;
                hTargetState=state;
            },
            // 首次收到真实数据：设置状态 + 启动入场动画
            startRender: function(state) {
                if(!CONFIGS[state])return;
                hTargetState=state;hCurrentState=state;hCurrentCfg=CONFIGS[state];
                hLifecycle="entering";hEntryStart=null;
            }
        };
        
        hRafId=requestAnimationFrame(haloFrame);
        
        // ═══════════════════════════════════════════════════════════════
        // DOM 元素和状态
        // ═══════════════════════════════════════════════════════════════
        
        var stateLabelEl = document.getElementById("stateLabel");
        var stateDescEl = document.getElementById("stateDescription");
        var navTitle = document.getElementById("navTitle");
        var instanceName = document.getElementById("instanceName");
        var instanceDesc = document.getElementById("instanceDesc");
        var instanceIcon = document.getElementById("instanceIcon");
        
        // 创建渲染器 — 已在上方直接初始化
        
        function setState(name) {
            if(!CONFIGS[name]) return;
            renderer.setState(name);
            stateLabelEl.textContent = CONFIGS[name].label;
            stateLabelEl.style.color = CONFIGS[name].color;
            stateLabelEl.style.opacity = '1';
            stateDescEl.textContent = CONFIGS[name].desc;
            stateDescEl.style.opacity = '1';
        }
        
        // 历史面板
        var historyPanel = document.getElementById("historyPanel");
        var historyToggle = document.getElementById("historyToggle");
        var historyList = document.getElementById("historyList");
        var historyVisible = false;
        
        window.toggleHistory = function() {
            historyVisible = !historyVisible;
            historyPanel.classList.toggle("visible", historyVisible);
            historyToggle.classList.toggle("expanded", historyVisible);
        };
        
        function updateHistory(history) {
            if (!history || history.length === 0) { 
                historyList.innerHTML = '<div class="history-item" style="color:rgba(255,255,255,0.3)">暂无记录</div>'; 
                return; 
            }
            historyList.innerHTML = "";
            history.slice().reverse().forEach(function(item) {
                var cfg = CONFIGS[item.state] || CONFIGS.idle;
                var t = new Date(item.timestamp);
                var ts = t.toLocaleTimeString("zh-CN", {hour:"2-digit", minute:"2-digit", second:"2-digit"});
                var div = document.createElement("div");
                div.className = "history-item";
                div.innerHTML = '<div class="history-dot" style="background:'+cfg.color+'"></div><span>'+cfg.label+'</span><span class="history-time">'+ts+'</span>';
                historyList.appendChild(div);
            });
        }
        
        // ═══════════════════════════════════════════════════════════════
        // WebSocket 连接
        // ═══════════════════════════════════════════════════════════════
        // 全屏功能
        // ═══════════════════════════════════════════════════════════════
        
        window.goFullscreen = function() {
            var el = document.documentElement;
            var requestFs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
            if (requestFs) {
                requestFs.call(el).catch(function(err) { console.log('全屏失败:', err); });
            }
        };
        
        // 全屏状态管理
        function isFullscreen() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
        }
        
        function enterFullscreenMode() {
            document.body.classList.add('is-fullscreen');
        }
        
        function exitFullscreenMode() {
            document.body.classList.remove('is-fullscreen');
        }
        
        // 监听全屏变化
        document.addEventListener('fullscreenchange', function() {
            if (isFullscreen()) {
                enterFullscreenMode();
            } else {
                exitFullscreenMode();
            }
        });
        document.addEventListener('webkitfullscreenchange', function() {
            if (isFullscreen()) { enterFullscreenMode(); } else { exitFullscreenMode(); }
        });
        
        // 全屏退出按钮
        document.getElementById('fsExitBtn').addEventListener('click', function() {
            if (isFullscreen()) {
                var fn = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen;
                if (fn) fn.call(document);
            }
        });
        
        // 全屏模式鼠标移动显示/隐藏UI（不隐藏鼠标）
        var fsHideTimer = null;
        document.addEventListener('mousemove', function() {
            if (!document.body.classList.contains('is-fullscreen')) return;
            document.body.classList.add('show-ui');
            clearTimeout(fsHideTimer);
            fsHideTimer = setTimeout(function() {
                document.body.classList.remove('show-ui');
            }, 3000);
        });
        
        // 全屏时间显示
        var fsTimeEl = document.getElementById('fsTime');
        setInterval(function() {
            if (document.body.classList.contains('is-fullscreen')) {
                var now = new Date();
                fsTimeEl.textContent = now.toLocaleTimeString("zh-CN", {hour:"2-digit", minute:"2-digit", second:"2-digit"});
            }
        }, 1000);
        
        // ═══════════════════════════════════════════════════════════════
        
        var ws = null, reconnectAttempts = 0;
        var statusDot = document.getElementById("statusDot");
        var statusText = document.getElementById("statusText");
        
        function connect() {
            var protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            var host = window.location.hostname || "localhost";
            ws = new WebSocket(protocol + "//" + host + (window.location.port ? ":" + window.location.port : "") + "/ws");
            
            ws.onopen = function() {
                statusDot.className = "status-dot connected";
                statusText.textContent = "已连接";
                reconnectAttempts = 0;
                ws.send(JSON.stringify({type:"get_state", instance_id: instanceId}));
            };
            
            ws.onmessage = function(event) {
                var data = JSON.parse(event.data);
                var instance = null;
                if (data.type === "state_update" && data.data.id === instanceId) {
                    instance = data.data;
                } else if (data.type === "states_update") {
                    instance = data.data.find(function(i) { return i.id === instanceId; });
                }
                if (instance) {
                    var wrap = document.getElementById('canvasWrap');
                    if (wrap && wrap.classList.contains('loading')) {
                        // 首次数据：用 startRender 直接进入真实状态的入场动画
                        wrap.classList.remove('loading');
                        renderer.startRender(instance.state);
                    } else {
                        // 后续更新：正常 morph
                        setState(instance.state);
                    }
                    updateHistory(instance.history);
                    navTitle.textContent = instance.name;
                    instanceName.textContent = instance.name;
                    instanceDesc.textContent = instance.description;
                    instanceIcon.textContent = instance.icon;
                }
            };
            
            ws.onclose = function() {
                statusDot.className = "status-dot disconnected";
                statusText.textContent = "连接断开";
                // 不重置状态 — 保持当前显示，避免重连时闪烁
                if (reconnectAttempts < 10) { 
                    reconnectAttempts++; 
                    setTimeout(connect, Math.min(1000 * Math.pow(2, reconnectAttempts), 30000)); 
                }
            };
        }
        
        connect();
    })();
    </script>
</body>
</html>
